<!-- Cowabunga: Wild Rush promo popup — Oxygen Code Block embed.

     All the actual popup logic lives in cowabunga-popup.js (one canonical
     copy, not a second one duplicated inline here) — upload it plus
     cowabunga-popup.css to the SAME WordPress media-library folder and
     point src/cssUrl below at wherever that folder resolves to; the script
     derives its default cssUrl, phoneImageUrl and phoneImageWebpUrl from
     its own <script src>, so leaving those three out of the config below
     works as long as cowabunga-popup.css/Phone.png/Phone.webp live next to
     cowabunga-popup.js on the server.

     Config MUST be set in a script block that runs BEFORE the src= script
     below — cowabunga-popup.js reads window.COWABUNGA_POPUP_CONFIG
     synchronously as soon as it loads. -->
<script>
  window.COWABUNGA_POPUP_CONFIG = {
    ctaUrl: '/cowabunga-wild-rush/',
    delayMs: 6000,
    suppressDays: 1
    // Uncomment and fill in only if cowabunga-popup.css / Phone.png /
    // Phone.webp are NOT uploaded alongside cowabunga-popup.js itself:
    // cssUrl: 'REPLACE_WITH_MEDIA_URL/cowabunga-popup.css',
    // phoneImageUrl: 'REPLACE_WITH_MEDIA_URL/Phone.png',
    // phoneImageWebpUrl: 'REPLACE_WITH_MEDIA_URL/Phone.webp'
  };
</script>
<script src="REPLACE_WITH_MEDIA_URL/cowabunga-popup.js"></script>
